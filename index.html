const COLS_ACT = [
  { k:'codigo',      t:'Código' },
  { k:'descripcion', t:'Descripción' },
  { k:'categoria',   t:'Categoría' },
  { k:'marcaModelo', t:'Marca / modelo' },
  { k:'serie',       t:'N° de serie' },
  { k:'ubicacion',   t:'Ubicación' },
  { k:'responsable', t:'Responsable' },
  { k:'cliente',     t:'Cliente (comodato)' },
  { k:'estado',      t:'Estado' },
  { k:'fechaAdq',    t:'Fecha de adquisición' },
  { k:'vida',        t:'Vida útil' },
  { k:'costo',       t:'Costo de adquisición', num:true, suma:true },
  { k:'factor',      t:'Factor UFV', num:true },
  { k:'costoAct',    t:'Costo actualizado', num:true, suma:true },
  { k:'depGestion',  t:'Dep. de la gestión', num:true, suma:true },
  { k:'depAcum',     t:'Dep. acumulada', num:true, suma:true },
  { k:'valorLibros', t:'Valor en libros', num:true, suma:true }
];
const PRESETS_ACT = {
  'Valor en libros':       ['codigo','descripcion','categoria','ubicacion','fechaAdq','valorLibros'],
  'Costo y depreciación':  ['codigo','descripcion','ubicacion','fechaAdq','costo','depAcum','valorLibros'],
  'Completo contable':     ['codigo','descripcion','categoria','fechaAdq','vida','costo','factor','costoAct','depGestion','depAcum','valorLibros'],
  'Inventario físico':     ['codigo','descripcion','marcaModelo','serie','ubicacion','responsable','estado']
};
const AGRUPAR = { '':'Sin agrupar', ubicacion:'Ubicación', categoria:'Categoría', responsable:'Responsable', estado:'Estado' };
const ESTADOS_ACT = ['Operativo', 'En mantenimiento', 'En desuso', 'Dado de baja'];
const REP_DEF = {
  tipo:'activos',
  act:{ titulo:'Reporte de activos fijos', cols:PRESETS_ACT['Costo y depreciación'], grupo:'ubicacion', orient:'auto', firmas:true, soloTotales:false },
  kar:{ orient:'horizontal', soloCon:true, nuevaPag:false, firmas:false },
  exi:{ orient:'auto', soloStock:false, valores:true, firmas:false }
};
function leerPrefRep(){
  try {
    const g = JSON.parse(localStorage.getItem('ca_rep') || '{}');
    return { tipo: g.tipo || REP_DEF.tipo, act: Object.assign({}, REP_DEF.act, g.act), kar: Object.assign({}, REP_DEF.kar, g.kar), exi: Object.assign({}, REP_DEF.exi, g.exi) };
  } catch(e){ return JSON.parse(JSON.stringify(REP_DEF)); }
}
function guardarPrefRep(p){ try { localStorage.setItem('ca_rep', JSON.stringify(p)); } catch(e){} }

/* Lista de casillas desplegable para filtrar */
function multi(id, titulo, opciones, marcadas){
  const set = new Set(marcadas);
  return `<details class="multi"><summary>${esc(titulo)}: <span id="${id}Res"></span></summary>
    <div class="fila" style="gap:10px;margin-top:6px;font-size:13px"><a href="#" data-todas="${id}">Todas</a><a href="#" data-ninguna="${id}">Ninguna</a></div>
    <div class="ops">${opciones.map(o => `<label><input type="checkbox" data-g="${id}" value="${esc(o.v)}" ${set.has(o.v) ? 'checked' : ''}> ${esc(o.t)}</label>`).join('')}</div></details>`;
}
function leerMulti(id){ return [...document.querySelectorAll(`input[data-g="${id}"]:checked`)].map(i => i.value); }
function resumenMulti(id, total, plural){
  const n = leerMulti(id).length, el = $('#' + id + 'Res');
  if (el) el.textContent = n === total ? 'todas' : n === 0 ? 'ninguna' : n + ' de ' + total;
}
function enlazarMulti(alCambiar){
  document.querySelectorAll('[data-todas],[data-ninguna]').forEach(a => a.onclick = e => {
    e.preventDefault();
    const g = a.dataset.todas || a.dataset.ninguna, v = !!a.dataset.todas;
    document.querySelectorAll(`input[data-g="${g}"]`).forEach(i => i.checked = v);
    alCambiar();
  });
  document.querySelectorAll('input[data-g]').forEach(i => i.onchange = alCambiar);
}
function textoFiltro(nombre, sel, total, etiqueta){
  if (sel.length === total) return '';
  if (!sel.length) return nombre + ': ninguna';
  return nombre + ': ' + sel.map(v => etiqueta ? etiqueta(v) : v).join(', ');
}

function paginaReporte(orient){
  tamPagina(`@page{size:letter ${orient === 'horizontal' ? 'landscape' : 'portrait'};margin:12mm 10mm 14mm 10mm;` +
    `@bottom-right{content:"Página " counter(page) " de " counter(pages);font:7.5pt Montserrat,Arial,sans-serif;color:#6E7480}}`);
  const marco = $('#repMarco');
  if (marco) marco.style.width = orient === 'horizontal' ? '279.4mm' : '215.9mm';
}
function encabezadoRep(titulo, lineas, empresa){
  return `<div class="repEnc">
    ${LOGO ? `<img src="${LOGO}" alt="">` : `<b>${esc(empresa)}</b>`}
    <div><h1>${esc(titulo)}</h1>${lineas.filter(Boolean).map(l => `<div class="det">${l}</div>`).join('')}</div>
  </div>`;
}
function pieRep(usuario, extra){
  const d = new Date();
  const f = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return `<div class="repPie">Generado el ${f} por ${esc(usuario || '')}${extra ? ' · ' + esc(extra) : ''} · ${esc(EMPRESA)}</div>`;
}
const firmasRep = () => `<div class="firmas"><div>Elaborado por</div><div>Revisado por</div><div>Aprobado por</div></div>`;

async function verReportes(tipo){
  if (!S.sesion) return verLogin(verReportes);
  marcarTab('reportes');
  const P = leerPrefRep();
  if (tipo) P.tipo = tipo;
  guardarPrefRep(P);
  pintar(`
    <div class="entre noImp">
      <div><h1>Reportes</h1><div class="muted">Elija el reporte, ajuste los filtros y genere el PDF en tamaño carta.</div></div>
      <div class="fila"><button class="btn pri" id="rImp">Imprimir / guardar PDF</button></div>
    </div>
    <div class="segmento noImp">
      <button data-r="activos" class="${P.tipo === 'activos' ? 'on' : ''}">Activos fijos</button>
      <button data-r="kardex" class="${P.tipo === 'kardex' ? 'on' : ''}">Kárdex de inventario</button>
      <button data-r="existencias" class="${P.tipo === 'existencias' ? 'on' : ''}">Existencias</button>
    </div>
    <div class="panel noImp" id="repOpc"><div class="cargando"><span class="spin"></span>Cargando datos…</div></div>
    <div class="nota ok noImp" style="margin:12px 0;font-size:13px">Al pulsar <b>Imprimir / guardar PDF</b> se abre la ventana de impresión. Para obtener el archivo elija <b>Destino: Guardar como PDF</b>; para papel, elija su impresora. Desactive <b>Encabezados y pies de página</b> y deje la <b>escala en 100 %</b>.</div>
    <div class="repVista" id="repVista"><div class="repMarco" id="repMarco"><div class="rep" id="reporte"></div></div></div>`);
  document.querySelectorAll('.segmento button').forEach(b => b.onclick = () => verReportes(b.dataset.r));
  $('#rImp').onclick = () => setTimeout(() => window.print(), 150);
  try {
    if (P.tipo === 'activos') await repActivos(P);
    else if (P.tipo === 'kardex') await repKardex(P);
    else await repExistencias(P);
  } catch(err){
    if ($('#repOpc')) $('#repOpc').innerHTML = `<div class="vacio">${esc(err.message)}</div>`;
  }
}

/* ---------- Reporte de activos fijos ---------- */

async function repActivos(P){
  const O = P.act;
  const cargar = async fecha => {
    const clave = 'act|' + (fecha || '');
    if (!S.rep || S.rep.clave !== clave) S.rep = { clave, datos: await srv('reporteActivos', S.token, fecha || '') };
    return S.rep.datos;
  };
  let D = await cargar(O.fechaCorte || '');
  const unicos = (k, base) => [...new Set((base || []).concat(D.activos.map(a => a[k] || '')))];
  const ubis = unicos('ubicacion', D.listas.ubicaciones);
  const resps = unicos('responsable', D.listas.responsables);
  const cats = unicos('categoria', D.listas.categorias.map(c => c.nombre));
  const sinAsignar = v => v || '(Sin asignar)';
  $('#repOpc').innerHTML = `
    <div class="medidas">
      <label class="campo" style="grid-column:span 2">Título<input type="text" id="raTit" value="${esc(O.titulo)}"></label>
      <label class="campo">Fecha de corte<input type="date" id="raFec" value="${esc(D.fechaCorte)}" max="${hoyISO()}"></label>
      <label class="campo">Orientación<select id="raOri">
        <option value="auto">Automática</option><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option></select></label>
    </div>
    <h2 class="mt">Qué activos incluir</h2>
    <div class="medidas">
      ${multi('fUbi', 'Ubicaciones', ubis.map(v => ({ v, t: sinAsignar(v) })), ubis)}
      ${multi('fRes', 'Responsables', resps.map(v => ({ v, t: sinAsignar(v) })), resps)}
      ${multi('fCat', 'Categorías', cats.map(v => ({ v, t: sinAsignar(v) })), cats)}
      ${multi('fEst', 'Estados', ESTADOS_ACT.map(v => ({ v, t: v })), ESTADOS_ACT.filter(e => e !== 'Dado de baja'))}
    </div>
    <h2 class="mt">Columnas</h2>
    <div class="fila" style="gap:8px;margin-bottom:10px">${Object.keys(PRESETS_ACT).map(k => `<button type="button" class="btn" data-preset="${esc(k)}" style="padding:6px 10px;font-size:13px">${esc(k)}</button>`).join('')}</div>
    <div class="colsRep">${COLS_ACT.map(c => `<label><input type="checkbox" data-col="${c.k}" ${O.cols.includes(c.k) ? 'checked' : ''}> ${esc(c.t)}</label>`).join('')}</div>
    <h2 class="mt">Presentación</h2>
    <div class="medidas">
      <label class="campo">Agrupar por<select id="raGru">${Object.entries(AGRUPAR).map(([k, v]) => `<option value="${k}" ${k === O.grupo ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="raTot" ${O.soloTotales ? 'checked' : ''}> Solo totales por grupo</label>
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="raFir" ${O.firmas ? 'checked' : ''}> Espacio para firmas</label>
    </div>`;
  $('#raOri').value = O.orient;

  const dibujar = () => {
    O.titulo = $('#raTit').value.trim() || REP_DEF.act.titulo;
    O.orient = $('#raOri').value;
    O.grupo = $('#raGru').value;
    O.soloTotales = $('#raTot').checked && !!O.grupo;
    $('#raTot').disabled = !O.grupo;
    O.firmas = $('#raFir').checked;
    O.cols = COLS_ACT.filter(c => $(`input[data-col="${c.k}"]`).checked).map(c => c.k);
    guardarPrefRep(P);
    resumenMulti('fUbi', ubis.length); resumenMulti('fRes', resps.length); resumenMulti('fCat', cats.length); resumenMulti('fEst', ESTADOS_ACT.length);
    const sel = { u: new Set(leerMulti('fUbi')), r: new Set(leerMulti('fRes')), c: new Set(leerMulti('fCat')), e: new Set(leerMulti('fEst')) };
    const filas = D.activos.filter(a => sel.u.has(a.ubicacion || '') && sel.r.has(a.responsable || '') && sel.c.has(a.categoria || '') && sel.e.has(a.estado))
      .sort((x, y) => (O.grupo ? sinAsignar(x[O.grupo]).localeCompare(sinAsignar(y[O.grupo])) : 0) || x.codigo.localeCompare(y.codigo));
    const cols = COLS_ACT.filter(c => O.cols.includes(c.k));
    const orient = O.orient !== 'auto' ? O.orient : (cols.length > 7 || cols.filter(c => c.num).length >= 4 ? 'horizontal' : 'vertical');
    paginaReporte(orient);

    const valor = (a, k) => {
      switch (k){
        case 'marcaModelo': return esc([a.marca, a.modelo].filter(Boolean).join(' ') || '—');
        case 'fechaAdq': return fecha(a.fechaAdq);
        case 'estado': return esc(a.estado) + (a.fechaBaja ? `<br><span class="mut">${fecha(a.fechaBaja)}</span>` : '');
        case 'vida': return a.vidaMeses ? `${a.vida} años <span class="mut">(${a.meses}/${a.vidaMeses} m)</span>` : 'No aplica';
        case 'factor': return Number(a.factor || 1).toFixed(5);
        case 'responsable': case 'ubicacion': case 'categoria': return esc(a[k] || '—');
        case 'descripcion': return esc(a.descripcion || '—');
        default: return COLS_ACT.find(c => c.k === k).num ? nf.format(a[k] || 0) : esc(a[k] || '—');
      }
    };
    const sumables = cols.filter(c => c.suma);
    const sumar = lista => { const t = {}; sumables.forEach(c => t[c.k] = lista.filter(a => a.estado !== 'Dado de baja').reduce((s, a) => s + (Number(a[c.k]) || 0), 0)); return t; };
    const filaTotal = (clase, etiqueta, lista) => {
      const t = sumar(lista);
      const iPrimeraNum = cols.findIndex(c => c.num);
      const span = iPrimeraNum < 0 ? cols.length : iPrimeraNum;
      return `<tr class="${clase}"><td colspan="${span}">${etiqueta}</td>${cols.slice(span).map(c => `<td class="num">${c.suma ? nf.format(t[c.k]) : ''}</td>`).join('')}</tr>`;
    };

    let cuerpo = '';
    const grupos = [];
    if (O.grupo){
      filas.forEach(a => { const g = sinAsignar(a[O.grupo]); let G = grupos.find(x => x.g === g); if (!G) grupos.push(G = { g, l: [] }); G.l.push(a); });
    }
    if (O.soloTotales){
      cuerpo = `<table><thead><tr><th>${esc(AGRUPAR[O.grupo])}</th><th class="num">Cantidad</th>${sumables.map(c => `<th class="num">${esc(c.t)}</th>`).join('')}</tr></thead><tbody>
        ${grupos.map(G => { const t = sumar(G.l); return `<tr><td>${esc(G.g)}</td><td class="num">${G.l.length}</td>${sumables.map(c => `<td class="num">${nf.format(t[c.k])}</td>`).join('')}</tr>`; }).join('')}
        ${(() => { const t = sumar(filas); return `<tr class="totalG"><td>TOTAL GENERAL</td><td class="num">${filas.length}</td>${sumables.map(c => `<td class="num">${nf.format(t[c.k])}</td>`).join('')}</tr>`; })()}
      </tbody></table>`;
    } else {
      const NW = ['codigo', 'fechaAdq', 'vida', 'serie'];
      const filaHTML = a => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}${NW.includes(c.k) ? ' nw' : ''}${a.estado === 'Dado de baja' ? ' baja' : ''}">${valor(a, c.k)}</td>`).join('')}</tr>`;
      cuerpo = `<table><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${esc(c.t)}</th>`).join('')}</tr></thead><tbody>
        ${O.grupo
          ? grupos.map(G => `<tr class="grupo"><td colspan="${cols.length}">${esc(AGRUPAR[O.grupo])}: ${esc(G.g)} <span class="mut">(${G.l.length} ${G.l.length === 1 ? 'activo' : 'activos'})</span></td></tr>
              ${G.l.map(filaHTML).join('')}${sumables.length ? filaTotal('subt', 'Subtotal ' + esc(G.g), G.l) : ''}`).join('')
          : filas.map(filaHTML).join('')}
        ${sumables.length ? filaTotal('totalG', 'TOTAL GENERAL', filas) : ''}
      </tbody></table>`;
    }
    const hayBajas = filas.some(a => a.estado === 'Dado de baja');
    const filtros = [
      textoFiltro('Ubicaciones', [...sel.u], ubis.length, sinAsignar),
      textoFiltro('Responsables', [...sel.r], resps.length, sinAsignar),
      textoFiltro('Categorías', [...sel.c], cats.length, sinAsignar),
      sel.e.size === 3 && !sel.e.has('Dado de baja') ? 'Solo activos vigentes' : textoFiltro('Estados', [...sel.e], ESTADOS_ACT.length)
    ].filter(Boolean).join(' · ');
    const ufvTxt = D.ufv ? (D.ufvCorte ? `Actualizado por UFV (${D.ufvCorte.valor.toFixed(5)} del ${fecha(D.ufvCorte.fecha)})` : 'Actualización por UFV: falta registrar la UFV') : 'Sin actualización por UFV';
    $('#reporte').innerHTML = encabezadoRep(O.titulo, [
      `<b>${esc(D.empresa)}</b>`,
      `Al ${fecha(D.fechaCorte)} · ${ufvTxt}`,
      `Depreciación en línea recta · inicio: ${D.inicioSiguiente ? 'mes siguiente a la adquisición' : 'mes de adquisición'} · cierre de gestión: mes ${D.mesCierre}`
    ], D.empresa) +
      (filtros ? `<div class="repFiltros"><b>Filtros:</b> ${esc(filtros)}</div>` : '') +
      (filas.length ? cuerpo : '<div class="vacio">Ningún activo cumple los filtros elegidos.</div>') +
      (hayBajas && sumables.length ? '<div class="repFiltros" style="margin-top:2mm">Los totales excluyen los activos dados de baja.</div>' : '') +
      (O.firmas ? firmasRep() : '') +
      pieRep(D.usuario, filas.length + (filas.length === 1 ? ' activo' : ' activos'));
  };

  ['raTit', 'raOri', 'raGru', 'raTot', 'raFir'].forEach(id => $('#' + id).addEventListener(id === 'raTit' ? 'input' : 'change', dibujar));
  document.querySelectorAll('input[data-col]').forEach(i => i.onchange = dibujar);
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    const l = PRESETS_ACT[b.dataset.preset];
    document.querySelectorAll('input[data-col]').forEach(i => i.checked = l.includes(i.dataset.col));
    dibujar();
  });
  enlazarMulti(dibujar);
  $('#raFec').onchange = async e => {
    const f = e.target.value;
    $('#reporte').innerHTML = '<div class="cargando"><span class="spin"></span>Calculando al ' + fecha(f) + '…</div>';
    try { D = await cargar(f); O.fechaCorte = f; dibujar(); } catch(err){ aviso(err.message, 'error'); }
  };
  dibujar();
}

/* ---------- Kárdex de inventario ---------- */

async function repKardex(P){
  const O = P.kar;
  if (!S.rep || S.rep.clave !== 'kar') S.rep = { clave:'kar', datos: await srv('reporteKardex', S.token) };
  const D = S.rep.datos;
  const hoy = hoyISO();
  const iniAnio = hoy.slice(0, 4) + '-01-01';
  $('#repOpc').innerHTML = `
    <div class="medidas">
      <label class="campo">Desde<input type="date" id="rkDes" value="${O.desde || iniAnio}" max="${hoy}"></label>
      <label class="campo">Hasta<input type="date" id="rkHas" value="${O.hasta && O.hasta <= hoy ? O.hasta : hoy}" max="${hoy}"></label>
      <label class="campo">Orientación<select id="rkOri"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></label>
      ${multi('fIt', 'Ítems', D.items.map(i => ({ v: i.codigo, t: i.codigo + ' · ' + i.descripcion })), D.items.map(i => i.codigo))}
    </div>
    <div class="medidas mt">
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="rkCon" ${O.soloCon ? 'checked' : ''}> Solo ítems con movimientos en el periodo</label>
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="rkPag" ${O.nuevaPag ? 'checked' : ''}> Cada ítem en una página nueva</label>
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="rkFir" ${O.firmas ? 'checked' : ''}> Espacio para firmas</label>
    </div>`;
  $('#rkOri').value = O.orient;
  const dibujar = () => {
    O.desde = $('#rkDes').value || iniAnio; O.hasta = $('#rkHas').value || hoy;
    O.orient = $('#rkOri').value; O.soloCon = $('#rkCon').checked; O.nuevaPag = $('#rkPag').checked; O.firmas = $('#rkFir').checked;
    guardarPrefRep(P);
    resumenMulti('fIt', D.items.length);
    paginaReporte(O.orient);
    const sel = new Set(leerMulti('fIt'));
    const entra = t => t === 'Entrada' || t === 'Ajuste positivo';
    const sale = t => t === 'Salida' || t === 'Ajuste negativo';
    const resumen = [];
    const bloques = D.items.filter(i => sel.has(i.codigo)).map(i => {
      const todos = D.movs.filter(m => m.codigo === i.codigo);
      const previos = todos.filter(m => m.fecha && m.fecha < O.desde);
      const ult = previos[previos.length - 1];
      const ini = { cant: ult ? ult.saldoCant || 0 : 0, valor: ult ? ult.saldoValor || 0 : 0 };
      const per = todos.filter(m => m.fecha >= O.desde && m.fecha <= O.hasta);
      if (O.soloCon && !per.length) return '';
      let eC = 0, eV = 0, sC = 0, sV = 0;
      const filas = per.map(m => {
        const e = entra(m.tipo), sa = sale(m.tipo);
        if (e){ eC += m.cantidad; eV += m.importe || 0; }
        if (sa){ sC += m.cantidad; sV += m.importe || 0; }
        return `<tr>
          <td>${fecha(m.fecha)}</td><td class="mono">${esc(m.numero)}</td><td>${esc(m.tipo)}</td>
          <td>${esc(m.documento || m.motivo || '')}${m.alerta ? `<br><span class="alerta">${esc(m.alerta)}</span>` : ''}</td>
          <td>${esc(m.ubicacion)}${m.destino ? ' → ' + esc(m.destino) : ''}</td>
          <td class="num">${e ? nq.format(m.cantidad) : ''}</td><td class="num">${sa ? nq.format(m.cantidad) : ''}</td>
          <td class="num">${m.tipo === 'Traspaso' ? '' : nf.format(m.cuAplicado || 0)}</td>
          <td class="num">${e ? nf.format(m.importe || 0) : ''}</td><td class="num">${sa ? nf.format(m.importe || 0) : ''}</td>
          <td class="num">${nq.format(m.saldoCant || 0)}</td><td class="num">${nf.format(m.saldoValor || 0)}</td></tr>`;
      }).join('');
      const fin = per.length ? { cant: per[per.length - 1].saldoCant || 0, valor: per[per.length - 1].saldoValor || 0 } : ini;
      resumen.push({ i, ini, eC, sC, fin });
      return `<div class="itemK ${O.nuevaPag ? 'nueva' : ''}">
        <div class="itemTit"><span class="mono">${esc(i.codigo)}</span> · ${esc(i.descripcion)} <span class="mut">· ${esc(i.categoria || 'Sin categoría')} · unidad: ${esc(i.unidad || '—')}</span></div>
        <table><thead><tr><th>Fecha</th><th>N°</th><th>Tipo</th><th>Documento / motivo</th><th>Ubicación</th>
          <th class="num">Entrada</th><th class="num">Salida</th><th class="num">C. unitario</th><th class="num">Entrada Bs</th><th class="num">Salida Bs</th><th class="num">Saldo</th><th class="num">Saldo Bs</th></tr></thead>
        <tbody>
          <tr class="grupo"><td colspan="10">Saldo inicial al ${fecha(O.desde)}</td><td class="num">${nq.format(ini.cant)}</td><td class="num">${nf.format(ini.valor)}</td></tr>
          ${filas || '<tr><td colspan="12" class="mut">Sin movimientos en el periodo.</td></tr>'}
          <tr class="totalG"><td colspan="5">Totales del periodo y saldo final</td><td class="num">${nq.format(eC)}</td><td class="num">${nq.format(sC)}</td><td></td>
            <td class="num">${nf.format(eV)}</td><td class="num">${nf.format(sV)}</td><td class="num">${nq.format(fin.cant)}</td><td class="num">${nf.format(fin.valor)}</td></tr>
        </tbody></table></div>`;
    }).filter(Boolean);
    const tablaResumen = resumen.length > 1 ? `<div class="itemK ${O.nuevaPag ? 'nueva' : ''}"><div class="itemTit">Resumen del periodo</div>
      <table><thead><tr><th>Código</th><th>Descripción</th><th>Unidad</th><th class="num">Saldo inicial</th><th class="num">Entradas</th><th class="num">Salidas</th><th class="num">Saldo final</th><th class="num">Valor final Bs</th></tr></thead><tbody>
      ${resumen.map(r => `<tr><td class="mono">${esc(r.i.codigo)}</td><td>${esc(r.i.descripcion)}</td><td>${esc(r.i.unidad)}</td><td class="num">${nq.format(r.ini.cant)}</td><td class="num">${nq.format(r.eC)}</td><td class="num">${nq.format(r.sC)}</td><td class="num">${nq.format(r.fin.cant)}</td><td class="num">${nf.format(r.fin.valor)}</td></tr>`).join('')}
      <tr class="totalG"><td colspan="7">VALOR TOTAL AL ${fecha(O.hasta)}</td><td class="num">${nf.format(resumen.reduce((s, r) => s + r.fin.valor, 0))}</td></tr></tbody></table></div>` : '';
    $('#reporte').innerHTML = encabezadoRep('Kárdex físico valorado', [
      `<b>${esc(D.empresa)}</b>`, `Del ${fecha(O.desde)} al ${fecha(O.hasta)} · Valuación por promedio ponderado`
    ], D.empresa) +
      (bloques.length ? bloques.join('') + tablaResumen : '<div class="vacio">No hay ítems con movimientos para los filtros elegidos.</div>') +
      (O.firmas ? firmasRep() : '') + pieRep(D.usuario, bloques.length + (bloques.length === 1 ? ' ítem' : ' ítems'));
  };
  ['rkDes', 'rkHas', 'rkOri', 'rkCon', 'rkPag', 'rkFir'].forEach(id => $('#' + id).onchange = dibujar);
  enlazarMulti(dibujar);
  dibujar();
}

/* ---------- Existencias de inventario ---------- */

async function repExistencias(P){
  const O = P.exi;
  if (!S.rep || S.rep.clave !== 'exi') S.rep = { clave:'exi', datos: await srv('inventario', S.token) };
  const D = S.rep.datos;
  const ubis = D.listas.ubicaciones.filter(u => u !== D.listas.comodato);
  const cats = [...new Set(D.listas.catInventario.concat(D.items.map(i => i.categoria || '')))];
  const sinCat = v => v || '(Sin categoría)';
  $('#repOpc').innerHTML = `
    <div class="medidas">
      ${multi('fCi', 'Categorías', cats.map(v => ({ v, t: sinCat(v) })), cats)}
      ${multi('fUi', 'Ubicaciones (columnas)', ubis.map(v => ({ v, t: v })), ubis)}
      <label class="campo">Orientación<select id="reOri"><option value="auto">Automática</option><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option></select></label>
    </div>
    <div class="medidas mt">
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="reSto" ${O.soloStock ? 'checked' : ''}> Solo ítems con stock</label>
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="reVal" ${O.valores ? 'checked' : ''}> Mostrar costo y valor</label>
      <label class="fila" style="gap:6px;font-size:14px"><input type="checkbox" id="reFir" ${O.firmas ? 'checked' : ''}> Espacio para firmas</label>
    </div>`;
  $('#reOri').value = O.orient;
  const dibujar = () => {
    O.orient = $('#reOri').value; O.soloStock = $('#reSto').checked; O.valores = $('#reVal').checked; O.firmas = $('#reFir').checked;
    guardarPrefRep(P);
    resumenMulti('fCi', cats.length); resumenMulti('fUi', ubis.length);
    const sc = new Set(leerMulti('fCi')), su = ubis.filter(u => leerMulti('fUi').includes(u));
    const items = D.items.filter(i => sc.has(i.categoria || '') && (!O.soloStock || i.stock > 0));
    const nCols = 6 + su.length + (O.valores ? 2 : 0);
    const orient = O.orient !== 'auto' ? O.orient : (nCols > 8 ? 'horizontal' : 'vertical');
    paginaReporte(orient);
    const total = items.reduce((s, i) => s + i.valor, 0);
    $('#reporte').innerHTML = encabezadoRep('Existencias de inventario', [
      `<b>${esc(EMPRESA)}</b>`, `Al ${fecha(hoyISO())} · Valuación por promedio ponderado`
    ], EMPRESA) +
      ([textoFiltro('Categorías', [...sc], cats.length, sinCat)].filter(Boolean).map(f => `<div class="repFiltros"><b>Filtros:</b> ${esc(f)}</div>`).join('')) +
      (items.length ? `<table><thead><tr><th>Código</th><th>Descripción</th><th>Unidad</th>${su.map(u => `<th class="num">${esc(u)}</th>`).join('')}
        <th class="num">Stock total</th><th class="num">Mínimo</th><th>Situación</th>${O.valores ? '<th class="num">Costo prom.</th><th class="num">Valor Bs</th>' : ''}</tr></thead><tbody>
        ${items.map(i => `<tr><td class="mono">${esc(i.codigo)}</td><td>${esc(i.descripcion)}<br><span class="mut">${esc(sinCat(i.categoria))}</span></td><td>${esc(i.unidad)}</td>
          ${su.map(u => `<td class="num">${nq.format(i.porUbicacion[u] || 0)}</td>`).join('')}
          <td class="num"><b>${nq.format(i.stock)}</b></td><td class="num">${i.stockMin ? nq.format(i.stockMin) : '—'}</td><td>${esc(i.situacion)}</td>
          ${O.valores ? `<td class="num">${nf.format(i.prom)}</td><td class="num">${nf.format(i.valor)}</td>` : ''}</tr>`).join('')}
        ${O.valores ? `<tr class="totalG"><td colspan="${nCols - 1}">VALOR TOTAL DEL INVENTARIO</td><td class="num">${nf.format(total)}</td></tr>` : ''}
        </tbody></table>` : '<div class="vacio">Ningún ítem cumple los filtros elegidos.</div>') +
      (O.firmas ? firmasRep() : '') + pieRep(S.sesion && S.sesion.nombre, items.length + (items.length === 1 ? ' ítem' : ' ítems'));
  };
  ['reOri', 'reSto', 'reVal', 'reFir'].forEach(id => $('#' + id).onchange = dibujar);
  enlazarMulti(dibujar);
  dibujar();
}

/* ------------------------------------------------------------- Inventarios */

async function verInventario(){
  marcarTab('inventario');
  cargando('Cargando inventario…');
  try { S.inv = await srv('inventario', S.token); } catch(err){ pintar(`<div class="panel vacio">${esc(err.message)}</div>`); return; }
  pintarInventario();
}

function pintarInventario(){
  marcarTab('inventario');
  const it = S.inv.items;
  const valor = it.reduce((s, i) => s + i.valor, 0);
  const reponer = it.filter(i => i.situacion !== 'Normal').length;
  pintar(`
    <div class="entre">
      <div><h1>Inventarios</h1><div class="muted">Valuación por promedio ponderado</div></div>
      <div class="fila">${puedeEditar() ? '<button class="btn" id="bItem">+ Nuevo ítem</button><button class="btn pri" id="bMov">Registrar movimiento</button>' : ''}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Ítems</div><div class="v">${it.length}</div></div>
      <div class="kpi"><div class="l">Valor del inventario</div><div class="v">${nf.format(valor)}</div></div>
      <div class="kpi"><div class="l">Por reponer o sin stock</div><div class="v" style="color:${reponer ? 'var(--oxido)' : 'inherit'}">${reponer}</div></div>
      <div class="kpi"><div class="l">Ubicaciones</div><div class="v">${S.inv.listas.ubicaciones.filter(u => u !== S.inv.listas.comodato).length}</div></div>
    </div>
    <input type="text" id="iQ" placeholder="Buscar ítem…" style="margin-bottom:12px">
    <div id="iLista"></div>`);
  if ($('#bItem')) $('#bItem').onclick = () => verFormItem(null);
  if ($('#bMov')) $('#bMov').onclick = () => verFormMov('');
  const pintarL = () => {
    const q = $('#iQ').value.trim().toLowerCase();
    const l = it.filter(i => !q || (i.codigo + ' ' + i.descripcion + ' ' + i.categoria).toLowerCase().includes(q));
    $('#iLista').innerHTML = l.length ? `
      <div class="envoltura"><table class="tabla">
        <thead><tr><th>Código</th><th>Descripción</th><th class="num">Stock</th><th class="ocultaMovil">Unidad</th><th class="num ocultaMovil">Costo promedio</th><th class="num ocultaMovil">Valor</th><th>Situación</th></tr></thead>
        <tbody>${l.map(i => `<tr class="clic" data-c="${esc(i.codigo)}">
          <td><span class="cod">${esc(i.codigo)}</span></td>
          <td><b style="font-weight:600">${esc(i.descripcion)}</b><div class="muted" style="font-size:13px">${esc(i.categoria)}${i.stockMin ? ' · mínimo ' + nq.format(i.stockMin) : ''}</div></td>
          <td class="num">${nq.format(i.stock)}</td><td class="ocultaMovil">${esc(i.unidad)}</td>
          <td class="num ocultaMovil">${nf.format(i.prom)}</td><td class="num ocultaMovil">${nf.format(i.valor)}</td>
          <td>${chip(i.situacion)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="panel vacio">${it.length ? 'Ningún ítem coincide.' : 'Todavía no hay ítems. Registre el catálogo con «Nuevo ítem».'}</div>`;
    document.querySelectorAll('#iLista tr.clic').forEach(tr => tr.onclick = () => verKardex(tr.dataset.c));
  };
  $('#iQ').oninput = pintarL;
  pintarL();
}

function verFormItem(i){
  const nuevo = !i; i = i || {};
  const L = S.inv.listas;
  pintar(`
    <div class="entre"><div><h1>${nuevo ? 'Nuevo ítem de inventario' : 'Editar ' + esc(i.codigo)}</h1></div></div>
    <form id="fI" class="panel">
      <div class="rejilla">
        <label class="campo" style="grid-column:span 2">Descripción *<input type="text" id="iDes" value="${esc(i.descripcion)}" required placeholder="Ej. Patch cord UTP cat. 6 de 1 m"></label>
        <label class="campo">Categoría<select id="iCat">${opciones(L.catInventario, i.categoria, 'Sin categoría')}</select></label>
        <label class="campo">Unidad de medida *<select id="iUni" required>${opciones(L.unidades, i.unidad, 'Elegir…')}</select></label>
        <label class="campo">Stock mínimo<input type="number" id="iMin" min="0" step="any" value="${i.stockMin || ''}" placeholder="0"></label>
        <label class="campo ancho">Observaciones<textarea id="iObs" rows="2">${esc(i.observaciones)}</textarea></label>
      </div>
      <p class="muted" style="font-size:13px">Las existencias no se escriben aquí: resultan de las entradas y salidas del kárdex.</p>
      <div class="fila mt"><button class="btn pri" id="bGI">${nuevo ? 'Crear ítem' : 'Guardar cambios'}</button><button type="button" class="btn" id="bCI">Cancelar</button></div>
    </form>`);
  $('#bCI').onclick = () => nuevo ? pintarInventario() : verKardex(i.codigo);
  $('#fI').onsubmit = async e => {
    e.preventDefault();
    const b = $('#bGI'); ocupado(b, true);
    try {
      const r = await srv('guardarItem', S.token, { codigo: i.codigo || '', descripcion: $('#iDes').value, categoria: $('#iCat').value, unidad: $('#iUni').value, stockMin: $('#iMin').value, observaciones: $('#iObs').value });
      aviso(nuevo ? 'Ítem creado: ' + r.codigo + '.' : 'Ítem actualizado.');
      S.inv = await srv('inventario', S.token);
      verKardex(r.codigo);
    } catch(err){ aviso(err.message, 'error'); ocupado(b, false); }
  };
}

function verFormMov(codigo){
  const L = S.inv.listas;
  const ubis = L.ubicaciones.filter(u => u !== L.comodato);
  pintar(`
    <div class="entre"><div><h1>Registrar movimiento</h1><div class="muted">Entrada por compra, salida por instalación o consumo, ajuste por conteo físico o traspaso entre ubicaciones.</div></div></div>
    <form id="fM" class="panel">
      <div class="rejilla">
        <label class="campo">Tipo *<select id="mTip" required>${opciones(L.tiposMov, 'Entrada')}</select></label>
        <label class="campo" style="grid-column:span 2">Ítem *<select id="mCod" required>${'<option value="">Elegir…</option>' + S.inv.items.map(i => `<option value="${esc(i.codigo)}" ${i.codigo === codigo ? 'selected' : ''}>${esc(i.codigo)} · ${esc(i.descripcion)}</option>`).join('')}</select></label>
        <label class="campo">Fecha *<input type="date" id="mFec" value="${hoyISO()}" max="${hoyISO()}" required></label>
        <label class="campo" id="lUbi">Ubicación *<select id="mUbi" required>${opciones(ubis, '', 'Elegir…')}</select></label>
        <label class="campo" id="lDes">Ubicación de destino *<select id="mDes">${opciones(ubis, '', 'Elegir…')}</select></label>
        <label class="campo">Cantidad *<input type="number" id="mCan" min="0" step="any" required></label>
        <label class="campo" id="lCos">Costo unitario (Bs) *<input type="number" id="mCos" min="0" step="0.0001"></label>
        <label class="campo" id="lDoc">Documento de respaldo<input type="text" id="mDoc" placeholder="Factura, nota de remisión, orden de trabajo…"></label>
        <label class="campo" style="grid-column:span 2" id="lMot">Motivo o destino<input type="text" id="mMot" placeholder="Ej. Instalación al cliente…"></label>
        <label class="campo">Responsable<select id="mRes">${opciones(L.responsables, '', 'Sin indicar')}</select></label>
      </div>
      <div class="nota ok mt" id="mDisp" style="display:none"></div>
      <div class="fila mt2"><button class="btn pri" id="bGM">Registrar</button><button type="button" class="btn" id="bCM">Cancelar</button></div>
    </form>`);
  const ajustar = () => {
    const t = $('#mTip').value;
    $('#lDes').style.display = t === 'Traspaso' ? '' : 'none';
    $('#lCos').style.display = (t === 'Entrada' || t === 'Ajuste positivo') ? '' : 'none';
    $('#lCos').firstChild.textContent = t === 'Entrada' ? 'Costo unitario (Bs) *' : 'Costo unitario (Bs), vacío = promedio';
    $('#lDoc').firstChild.textContent = t === 'Entrada' ? 'Documento de respaldo *' : 'Documento de respaldo';
    $('#lMot').firstChild.textContent = t.startsWith('Ajuste') ? 'Motivo del ajuste *' : 'Motivo o destino';
    $('#lUbi').firstChild.textContent = t === 'Traspaso' ? 'Ubicación de origen *' : 'Ubicación *';
    const it = S.inv.items.find(i => i.codigo === $('#mCod').value);
    const u = $('#mUbi').value;
    const d = $('#mDisp');
    if (it){
      const enU = u ? (it.porUbicacion[u] || 0) : null;
      d.style.display = '';
      d.textContent = `Stock actual: ${nq.format(it.stock)} ${it.unidad}` + (u ? ` · en ${u}: ${nq.format(enU)}` : '') + ` · costo promedio Bs ${nf.format(it.prom)}`;
    } else d.style.display = 'none';
  };
  ['mTip', 'mCod', 'mUbi'].forEach(id => $('#' + id).onchange = ajustar);
  ajustar();
  $('#bCM').onclick = () => codigo ? verKardex(codigo) : pintarInventario();
  $('#fM').onsubmit = async e => {
    e.preventDefault();
    const b = $('#bGM'); ocupado(b, true);
    const cod = $('#mCod').value;
    try {
      S.inv = await srv('registrarMovimiento', S.token, {
        tipo: $('#mTip').value, codigo: cod, fecha: $('#mFec').value, ubicacion: $('#mUbi').value, destino: $('#mDes').value,
        cantidad: $('#mCan').value, costoUnit: $('#mCos').value, documento: $('#mDoc').value, motivo: $('#mMot').value, responsable: $('#mRes').value
      });
      aviso('Movimiento registrado.');
      verKardex(cod);
    } catch(err){ aviso(err.message, 'error'); ocupado(b, false); }
  };
}

async function verKardex(codigo){
  marcarTab('inventario');
  const i = S.inv.items.find(x => x.codigo === codigo);
  if (!i) return pintarInventario();
  cargando('Cargando kárdex…');
  let movs;
  try { movs = await srv('kardexItem', S.token, codigo); } catch(err){ aviso(err.message, 'error'); return pintarInventario(); }
  const ubis = Object.entries(i.porUbicacion).filter(([, q]) => q);
  pintar(`
    <div class="entre">
      <div><button class="btn" id="kV">← Inventario</button></div>
      <div class="fila">${puedeEditar() ? '<button class="btn" id="kE">Editar ítem</button><button class="btn pri" id="kM">Registrar movimiento</button>' : ''}</div>
    </div>
    <div class="fila"><span class="cod" style="font-size:16px">${esc(i.codigo)}</span>${chip(i.situacion)}</div>
    <h1 style="margin-top:8px">${esc(i.descripcion)}</h1>
    <div class="muted">${esc(i.categoria || 'Sin categoría')} · unidad: ${esc(i.unidad)}${i.stockMin ? ' · stock mínimo ' + nq.format(i.stockMin) : ''}</div>
    <div class="kpis mt">
      <div class="kpi"><div class="l">Stock total</div><div class="v">${nq.format(i.stock)}</div></div>
      <div class="kpi"><div class="l">Costo promedio</div><div class="v">${nf.format(i.prom)}</div></div>
      <div class="kpi"><div class="l">Valor</div><div class="v">${nf.format(i.valor)}</div></div>
      <div class="kpi"><div class="l">Por ubicación</div><div style="font-size:13px;margin-top:4px">${ubis.length ? ubis.map(([u, q]) => `${esc(u)}: <b class="mono">${nq.format(q)}</b>`).join('<br>') : '—'}</div></div>
    </div>
    <h2 class="mt">Kárdex físico valorado</h2>
    ${movs.length ? `<div class="envoltura"><table class="tabla hist">
      <thead><tr><th>Fecha</th><th>N°</th><th>Tipo</th><th class="ocultaMovil">Ubicación</th><th class="num">Cantidad</th><th class="num ocultaMovil">C. unitario</th><th class="num ocultaMovil">Importe</th><th class="num">Saldo</th><th class="num ocultaMovil">Saldo Bs</th></tr></thead>
      <tbody>${movs.map(m => {
        const neg = ['Salida', 'Ajuste negativo'].includes(m.tipo);
        return `<tr>
          <td style="white-space:nowrap">${fecha(m.fecha)}</td><td class="mono">${esc(m.numero)}</td>
          <td>${esc(m.tipo)}<div class="muted">${esc(m.documento || m.motivo)}</div>${m.alerta ? `<div style="color:var(--oxido);font-size:12px">${esc(m.alerta)}</div>` : ''}</td>
          <td class="ocultaMovil">${esc(m.ubicacion)}${m.destino ? ' → ' + esc(m.destino) : ''}</td>
          <td class="num">${neg ? '−' : m.tipo === 'Traspaso' ? '⇄' : '+'}${nq.format(m.cantidad)}</td>
          <td class="num ocultaMovil">${nf.format(m.cuAplicado || 0)}</td><td class="num ocultaMovil">${nf.format(m.importe || 0)}</td>
          <td class="num">${nq.format(m.saldoCant || 0)}</td><td class="num ocultaMovil">${nf.format(m.saldoValor || 0)}</td></tr>`;
      }).join('')}</tbody></table></div>` : '<div class="panel vacio">Sin movimientos todavía.</div>'}`);
  $('#kV').onclick = pintarInventario;
  if ($('#kE')) $('#kE').onclick = () => verFormItem(i);
  if ($('#kM')) $('#kM').onclick = () => verFormMov(i.codigo);
}

iniciar();
</script>
</body>
</html>
